[package]
name = "rusty-browser-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
slint = "1.18.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
